apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: minimal-cluster
  finalizers:
    - percona.com/delete-psmdb-pods-in-order
spec:
  crVersion: 1.17.0
  image: perconalab/percona-server-mongodb-operator:main-mongod7.0
  unsafeFlags:
    replsetSize: true
    mongosSize: true
  upgradeOptions:
    apply: disabled
    schedule: "0 2 * * *"
  secrets: // wrong here
    users: non-existent-secrets
    encryptionKey:non-existent-mongodb-encryption-key
  replsets:

  - name: rs0
    size: 3
    volumeSpec:
      persistentVolumeClaim:
        resources:
          requests:
            storage: 3Gi

  sharding:
    enabled: true

    configsvrReplSet:
      size: 3
      volumeSpec:
        persistentVolumeClaim:
          resources:
            requests:
              storage: 3Gi

    mongos:
      size: 3