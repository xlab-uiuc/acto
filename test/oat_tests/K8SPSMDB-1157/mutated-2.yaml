apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: my-cluster
spec:
  #platform: openshift
  crVersion: 1.16.2
  image: percona/percona-server-mongodb:6.0.15-12
  imagePullPolicy: Always
  sharding:
    enabled: true
    configsvrReplSet:
      size: 3
      volumeSpec:
        persistentVolumeClaim:
          resources:
            requests:
              storage: 1Gi
      expose:
        enabled: false

    mongos:
      size: 3
      expose:
        exposeType: ClusterIP

  replsets:
  - name: rs0
    affinity:
      antiAffinityTopologyKey: none
    expose:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 0.1G
    volumeSpec:
      persistentVolumeClaim:
        resources:
          requests:
            storage: 1Gi
    size: 3
  secrets:
    users: my-cluster-name-secrets
