apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: test-cluster
spec:
  crVersion: 1.16.0
  image: percona/percona-server-mongodb:7.0.8-5
  upgradeOptions:
    apply: disabled
    schedule: "0 2 * * *"
  secrets:
    users: test-cluster
  replsets:
  - name: rs0
    size: 3
    volumeSpec:
      persistentVolumeClaim:
        resources:
          requests:
            storage: 3Gi
    storage:
      engine: inMemory
      wiredTiger:
        engineConfig:
          cacheSizeRatio: 0.5
          directoryForIndexes: false
          journalCompressor: snappy
        collectionConfig:
          blockCompressor: snappy
        indexConfig:
          prefixCompression: true
      inMemory:
        engineConfig:
            inMemorySizeRatio: 0.5
  sharding:
    enabled: true
    configsvrReplSet:
      size: 3
      volumeSpec:
        persistentVolumeClaim:
          resources:
            requests:
              storage: 3Gi
    mongos:
      size: 3
