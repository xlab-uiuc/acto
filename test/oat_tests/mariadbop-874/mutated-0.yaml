apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: test-cluster
spec:
  connection:
    healthCheck:
      interval: 10s
      retryInterval: 3s
    params:
      parseTime: 'true'
    secretName: connection-mariadb
    secretTemplate:
      key: dsn
  database: mariadb
  env:
  - name: TZ
    value: SYSTEM
  galera:
    enabled: true
  livenessProbe:
    exec:
      command:
      - bash
      - -c
      - mariadb -u root -p"${MARIADB_ROOT_PASSWORD}" -e "SELECT 1;"
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 5
  myCnf: '[mariadb]

    bind_address=*

    default_storage_engine=InnoDB

    binlog_format=row

    innodb_autoinc_lock_mode=2

    innodb_buffer_pool_size=1024Mi

    max_allowed_packet=256Mi

    '
  passwordSecretKeyRef:
    key: password
    name: mariadb
  podDisruptionBudget:
    maxUnavailable: 50%
  port: 3306
  readinessProbe:
    exec:
      command:
      - bash
      - -c
      - mariadb -u root -p"${MARIADB_ROOT_PASSWORD}" -e "SELECT 1;"
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 5
  replicas: 3
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
  rootPasswordSecretKeyRef:
    key: root-password
    name: mariadb
  securityContext:
    allowPrivilegeEscalation: false
  service:
    type: ClusterIP
  storage:
    resizeInUseVolumes: true
    size: 1Gi
    storageClassName: standard
    waitForVolumeResize: true
  suspend: false
  timeZone: UTC
  updateStrategy:
    type: ReplicasFirstPrimaryLast
  username: mariadb
  maxScale:
    admin:
      port: 8989
    connection:
      port: 3306
      secretName: mxs-galera-conn
    enabled: true
