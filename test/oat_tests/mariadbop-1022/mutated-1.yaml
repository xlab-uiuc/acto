apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: test-cluster
spec:
  storage:
    size: 1Gi
    storageClassName: standard
    resizeInUseVolumes: true
    waitForVolumeResize: true
  galera:
    enabled: true
    primary:
      automaticFailover: true
    providerOptions:
      gcs.fc_limit: '64'
      gcs.fc_timeout: '0'
  replicas: 3
  podSecurityContext:
    runAsUser: 0