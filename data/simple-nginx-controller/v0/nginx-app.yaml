apiVersion: nginx.example.com/v1
kind: NginxApplication
metadata:
  name: my-nginx
  namespace: default
spec:
  replicas: 3
  image: nginx:latest
  nginxConfig: |
    events {
        worker_connections 1024;
    }

    http {
        server {
            listen 80;
            location / {
                root /usr/share/nginx/html;
                index index.html;
            }
        }
    }
