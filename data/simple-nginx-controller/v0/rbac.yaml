---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nginx-controller
rules:
  # NginxApplication CRD permissions
  - apiGroups: ["nginx.example.com"]
    resources: ["nginxapplications"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["nginx.example.com"]
    resources: ["nginxapplications/status"]
    verbs: ["get", "update", "patch"]

  # Managed resource permissions
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "serviceaccounts", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nginx-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nginx-controller
subjects:
  - kind: ServiceAccount
    name: nginx-controller
    namespace: default
