apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-controller
  namespace: default
  labels:
    app: nginx-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-controller
  template:
    metadata:
      labels:
        app: nginx-controller
    spec:
      serviceAccountName: nginx-controller
      containers:
        - name: controller
          image: ghcr.io/xlab-uiuc/simple-nginx-controller:v0
          imagePullPolicy: IfNotPresent
          command:
            - /controller
          args:
            - --namespace=default
            - --v=2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
