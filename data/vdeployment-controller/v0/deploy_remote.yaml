    app.kubernetes.io/name: vreplicaset-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vreplicaset-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vreplicaset-controller
    spec:
      containers:
        - image: ghcr.io/anvil-verifier/anvil/vreplicaset-controller:2d6b20be3048eaecf633ee7f0da6ff005c07ee9b
          name: controller
      serviceAccountName: vdeployment-controller
