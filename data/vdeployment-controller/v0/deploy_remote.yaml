apiVersion: apps/v1
kind: Deployment
metadata:
  name: vdeployment-controller
  namespace: vdeployment
  labels:
    app.kubernetes.io/name: vdeployment-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vdeployment-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vdeployment-controller
    spec:
      containers:
        - image: ghcr.io/anvil-verifier/anvil/vdeployment-controller:2d6b20be3048eaecf633ee7f0da6ff005c07ee9b
          name: controller
      serviceAccountName: vdeployment-controller
---
