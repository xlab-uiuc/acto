apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: vdeployment
  name: vdeployment
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vdeployment-controller
  namespace: vdeployment
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: vdeployment-controller
  name: vdeployment-controller-role
rules:
  - apiGroups:
      - anvil.dev
    resources:
      - "*"
    verbs:
      - "*"
  - apiGroups:
      - ""
    resources:
      - pods
      - replicasets
      - services
      - endpoints
      - persistentvolumeclaims
      - events
      - configmaps
      - secrets
      - serviceaccounts
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: vdeployment-controller
  name: vdeployment-controller-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vdeployment-controller-role
subjects:
  - kind: ServiceAccount
    name: vdeployment-controller
    namespace: vdeployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vdeployment-controller
  namespace: vdeployment
  labels:
    app.kubernetes.io/name: vdeployment-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vdeployment-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vdeployment-controller
    spec:
      containers:
        - image: ghcr.io/anvil-verifier/anvil/vdeployment-controller:9baba738eecc6e3f6041b4a7a89a9219fe94864d
          name: controller
      serviceAccountName: vdeployment-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vreplicaset-controller
  namespace: vdeployment
  labels:
    app.kubernetes.io/name: vreplicaset-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vreplicaset-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vreplicaset-controller
    spec:
      containers:
        - image: ghcr.io/anvil-verifier/anvil/vreplicaset-controller:9baba738eecc6e3f6041b4a7a89a9219fe94864d
          name: controller
      serviceAccountName: vdeployment-controller
