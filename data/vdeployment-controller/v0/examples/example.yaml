apiVersion: anvil.dev/v1
kind: VDeployment
metadata:
  name: pause-deployment
  labels:
    app: pause-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pause-demo
  template:
    metadata:
      labels:
        app: pause-demo
    spec:
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "dedicated"
          operator: "Equal"
          value: "gpu"
          effect: "NoSchedule"
      containers:
      - name: pause
        image: k8s.gcr.io/pause:3.9
      initContainers:
        - name: init-setup
          image: busybox:1.36
          command: ["sh", "-c", "echo 'Initializing...' && sleep 2 && echo 'Done'"]
      ephemeralContainers:
        - name: debug-container
          image: busybox:1.36
          command: ["sh", "-c", "echo 'Debugging...' && sleep 2 && echo 'Done'"]
