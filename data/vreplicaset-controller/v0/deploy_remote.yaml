apiVersion: apps/v1
kind: Deployment
metadata:
  name: vreplicaset-controller
  namespace: vreplicaset
  labels:
    app.kubernetes.io/name: vreplicaset-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vreplicaset-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vreplicaset-controller
    spec:
      containers:
        - image: ghcr.io/anvil-verifier/anvil/vreplicaset-controller:d9de170687d93e1bd95eb4f508c01f750e0a04e8
          name: controller
      serviceAccountName: vreplicaset-controller
