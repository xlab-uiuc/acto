apiVersion: apps/v1
kind: Deployment
metadata:
  name: vreplicaset-controller
  namespace: vreplicaset
  labels:
    app.kubernetes.io/name: vreplicaset-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vreplicaset-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vreplicaset-controller
    spec:
      containers:
        - image: ghcr.io/anvil-verifier/anvil/vreplicaset-controller:15d14bfbdd3bc7548947c2e26e1b159a97d0751e
          name: controller
      serviceAccountName: vreplicaset-controller
